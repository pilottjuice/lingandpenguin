<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北海道冬日之旅 2027</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#eef8ff;color:#334155}.hero{min-height:92vh;display:grid;place-items:center;text-align:center;padding:50px 20px;background:linear-gradient(#bde6ff,#e9f8ff,#eef8ff);position:relative;overflow:hidden}.hero h1{font-size:clamp(45px,8vw,78px);margin:8px 0;color:#1e293b}.love{font-size:38px;color:#f45d8d}.sub{color:#52809a}.count{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:720px;margin:34px auto}.unit{padding:22px 8px;background:#ffffffc9;border-radius:24px;box-shadow:0 12px 35px #8dcced40}.n{font-size:clamp(30px,6vw,50px);font-weight:900;color:#168bc1}.l{font-size:11px;color:#94a3b8;font-weight:800}.wrap{max-width:920px;margin:auto;padding:40px 18px 90px}.title{text-align:center;font-size:34px;color:#1e293b}.day{background:white;border-radius:28px;margin:22px 0;overflow:hidden;box-shadow:0 16px 40px #9fd6f233;animation:appear linear both;animation-timeline:view();animation-range:entry 0% cover 25%}.head{padding:22px;color:white;background:linear-gradient(120deg,#38bdf8,#3b82f6)}.day:nth-of-type(3n+1) .head{background:linear-gradient(120deg,#22c1c3,#38bdf8)}.day:nth-of-type(3n+2) .head{background:linear-gradient(120deg,#f472b6,#8b5cf6)}.date{font-weight:900;font-size:14px;opacity:.95}.head h2{margin:4px 0 0;font-size:26px}.items{padding:20px 24px}.item{padding:11px 0;border-bottom:1px solid #edf4f8;line-height:1.6}.item:last-child{border:0}.pin{color:#0ea5e9;margin-right:8px}.end{text-align:center;padding:35px;background:white;border-radius:30px;box-shadow:0 15px 40px #9fd6f233}.heart{color:#ec4899}.snow{position:fixed;top:-30px;color:#fff;z-index:5;pointer-events:none;animation:fall linear infinite}@keyframes fall{to{transform:translateY(110vh) rotate(300deg)}}@keyframes appear{from{opacity:.2;transform:translateY(24px)}to{opacity:1;transform:none}}@media(max-width:600px){.count{grid-template-columns:repeat(2,1fr)}} </style></head><body><section class="hero"><div><div class="love">♥</div><b style="letter-spacing:.25em;color:#168bc1">OUR HOKKAIDO LOVE STORY</b><h1>北海道冬日之旅</h1><p class="sub">19–27 January 2027 ・ Macau → Hokkaido ♡</p><div class="count" id="count"></div><p>❄ 仲有少少，就可以一齊睇北海道嘅雪啦 ❄</p></div></section><main class="wrap"><h2 class="title">我哋嘅 9 日冬日行程 ♡</h2><div id="plan"></div><div class="end"><div class="love">♥</div><h2>北海道，等我哋 ♡</h2><p>雪景、溫泉、滑雪、小樽夜景，最重要係同你一齊。</p><b>✈ 19 January 2027 ♥</b></div></main><script>
const data=[
['1月19日','出發去北海道 ♡',['澳門 → 香港（HB880）→ 札幌','抵達千歲市','千歲市住宿']],
['1月20日','支笏湖・洞爺湖',['支笏湖 LAKE SHIKOTSU｜9:00–10:00 快閃影藍冰','洞爺湖汽船 Lake TOYA｜13:30 班船最靚光','湖中心睇中島＋羊蹄','洞爺湖溫泉｜溫泉酒店浸住睇冬花火','20:30 洞爺湖冬花火｜每晚約8分鐘']],
['1月21日','登別 → 富良野',['洞爺湖','登別地獄谷 Noboribetsu Jigokudani','行30分鐘木棧道睇火山煙','長途去富良野 Check-in','森林精靈露台 Ningle Terrace｜17:00–21:00 點燈']],
['1月22日','富良野滑雪日 🎿',['滑雪','富良野滑雪場 北之峰區','札幌藥妝 Tsuruha Drug']],
['1月23日','神居滑雪日 🎿',['滑雪','神居滑雪場','札幌藥妝 Tsuruha Drug']],
['1月24日','美瑛雪景 → 札幌',['白鬚瀑布 → 青池｜8:00–9:00','四季彩之丘｜10:00–12:00 雪上電單車＋香蕉船','12:00–13:00 Lunch','札幌 Shopping｜狸小路＋札幌站 Stellar Place＋藥妝']],
['1月25日','小樽浪漫一日 ♡',['三角市場｜9:00 武田鮮魚店・三色丼早餐','小樽運河 → 天狗山｜11:00 運河影雪景','小樽音樂盒館夜景']],
['1月26日','札幌甜蜜散步',['白色戀人公園｜冬天限定燈飾＋DIY朱古力','大通公園','札幌 Shopping｜狸小路＋札幌站 Stellar Place＋藥妝']],
['1月27日','帶住回憶返屋企 ✈',['札幌（HB881）→ 香港 → 澳門','HB881｜16:00 飛']]];
document.querySelector('#plan').innerHTML=data.map(d=>`<article class="day"><header class="head"><div class="date">${d[0]}</div><h2>${d[1]}</h2></header><div class="items">${d[2].map(x=>`<div class="item"><span class="pin">●</span>${x}</div>`).join('')}</div></article>`).join('');
const target=new Date('2027-01-19T00:00:00+09:00'),labs=['日','小時','分鐘','秒'];function tick(){let d=Math.max(0,target-Date.now()),v=[Math.floor(d/864e5),Math.floor(d%864e5/36e5),Math.floor(d%36e5/6e4),Math.floor(d%6e4/1e3)];document.querySelector('#count').innerHTML=v.map((n,i)=>`<div class="unit"><div class="n">${String(n).padStart(2,'0')}</div><div class="l">${labs[i]}</div></div>`).join('')}tick();setInterval(tick,1000);for(let i=0;i<26;i++){let s=document.createElement('div');s.className='snow';s.textContent='❄';s.style.left=Math.random()*100+'vw';s.style.fontSize=12+Math.random()*22+'px';s.style.animationDuration=7+Math.random()*10+'s';s.style.animationDelay=-Math.random()*12+'s';document.body.appendChild(s)}
</script></body></html>
